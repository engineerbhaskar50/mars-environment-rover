<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sweet Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-pink-800 mb-8">Welcome to Our 3D Sweet Shop!</h1>
        <div class="flex justify-center">
            <div id="threejs-container" class="w-full max-w-4xl h-96 bg-white rounded-lg shadow-lg"></div>
        </div>
        <p class="text-center mt-4 text-gray-600">Use your mouse to orbit around the sweet shop!</p>
    </div>

    <script>
        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f8ff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth * 0.8, 400);
        document.getElementById('threejs-container').appendChild(renderer.domElement);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);

        // Floor
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Counter
        const counterGeometry = new THREE.BoxGeometry(8, 1, 2);
        const counterMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        const counter = new THREE.Mesh(counterGeometry, counterMaterial);
        counter.position.y = 0.5;
        scene.add(counter);

        // Candies (spheres)
        for (let i = 0; i < 10; i++) {
            const candyGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            const candyMaterial = new THREE.MeshLambertMaterial({
                color: Math.random() * 0xffffff
            });
            const candy = new THREE.Mesh(candyGeometry, candyMaterial);
            candy.position.set(
                (Math.random() - 0.5) * 6,
                1.2,
                (Math.random() - 0.5) * 1.5
            );
            scene.add(candy);
        }

        // Lollipops
        for (let i = 0; i < 5; i++) {
            const stickGeometry = new THREE.CylinderGeometry(0.05, 0.05, 1);
            const stickMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const stick = new THREE.Mesh(stickGeometry, stickMaterial);

            const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const headMaterial = new THREE.MeshLambertMaterial({
                color: Math.random() * 0xffffff
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);

            stick.position.set(
                (Math.random() - 0.5) * 6,
                0.5,
                (Math.random() - 0.5) * 1.5
            );
            head.position.set(
                stick.position.x,
                stick.position.y + 0.5,
                stick.position.z
            );

            scene.add(stick);
            scene.add(head);
        }

        // Cakes (boxes)
        for (let i = 0; i < 3; i++) {
            const cakeGeometry = new THREE.BoxGeometry(1, 0.5, 1);
            const cakeMaterial = new THREE.MeshLambertMaterial({
                color: Math.random() * 0xffffff
            });
            const cake = new THREE.Mesh(cakeGeometry, cakeMaterial);
            cake.position.set(
                (Math.random() - 0.5) * 6,
                1,
                (Math.random() - 0.5) * 1.5
            );
            scene.add(cake);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * 0.8, 400);
        });
    </script>
</body>
</html>
